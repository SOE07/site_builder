<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padelstart – Der richtige Padelschläger für Einsteiger</title>
<meta name="description" content="Ehrliche Kaufberatung für Padel-Einsteiger: Schläger-Finder, vier Empfehlungen nach Spielertyp, abgeglichene Daten und klare Nachteile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style id="site-style">:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --ink:#14202E; --muted:#4A5868; --line:#D5DEE8;
  --court:#1D4F91; --court-deep:#163E73; --court-ink:#FFFFFF; --court-line:rgba(255,255,255,.55);
  --ball:#DCEB3B; --ball-ink:#1B2A0A; --link:#1D4F91; --warn-bg:#FFF6D6; --warn-ink:#5A4300;
  --ph-bg:#EEF3F8; --ph-line:#9FB2C7;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1826; --surface:#152335; --ink:#E7EEF6; --muted:#A8B6C6; --line:#2A3B52;
    --court:#1F5299; --court-deep:#173F78; --court-ink:#FFFFFF; --court-line:rgba(255,255,255,.45);
    --ball:#D6E640; --ball-ink:#18240A; --link:#8DB8F2; --warn-bg:#3A3212; --warn-ink:#F3E3A8;
    --ph-bg:#1A2B40; --ph-line:#4C6380;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1826; --surface:#152335; --ink:#E7EEF6; --muted:#A8B6C6; --line:#2A3B52;
  --court:#1F5299; --court-deep:#173F78; --court-ink:#FFFFFF; --court-line:rgba(255,255,255,.45);
  --ball:#D6E640; --ball-ink:#18240A; --link:#8DB8F2; --warn-bg:#3A3212; --warn-ink:#F3E3A8;
  --ph-bg:#1A2B40; --ph-line:#4C6380;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);}
img,svg{max-width:100%;}
a{color:var(--link);text-underline-offset:.18em;}
a:focus-visible,button:focus-visible{outline:3px solid var(--ball);outline-offset:2px;border-radius:4px;}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;line-height:1.05;letter-spacing:-.005em;margin:0 0 .5em;}
h1{font-size:clamp(2.4rem,6vw,4.1rem);font-weight:700;}
h2{font-size:clamp(1.8rem,3.6vw,2.5rem);font-weight:700;margin-top:1.6em;}
h3{font-size:1.55rem;font-weight:600;margin-top:1.6em;}
p{margin:0 0 1em;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;}
.prose{max-width:68ch;}

/* Header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.6rem;}
.brand svg{width:30px;height:30px;}
nav.main{display:flex;gap:4px;flex-wrap:wrap;}
nav.main a{text-decoration:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:6px;font-size:.98rem;}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--ph-bg);}
nav.main a:hover{color:var(--ink);}
@media (max-width:640px){
  .site-header .wrap{height:auto;padding-top:10px;padding-bottom:8px;flex-direction:column;align-items:flex-start;gap:4px;}
  nav.main{margin-left:-12px;}
}

/* Disclosure strip */
.disclosure{font-size:.9rem;color:var(--muted);padding:10px 0;border-bottom:1px solid var(--line);}

/* Hero with finder */
.hero{padding:48px 0 56px;}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:start;}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:28px;}}
.hero p.lede{font-size:1.2rem;color:var(--muted);max-width:40ch;}
.hero ul.facts{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;}
.hero ul.facts li{padding-left:28px;position:relative;}
.hero ul.facts li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:14px;border-radius:50%;background:var(--ball);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);}

.finder{background:var(--court);color:var(--court-ink);border-radius:14px;padding:28px;position:relative;overflow:hidden;}
.finder::before{content:"";position:absolute;inset:14px;border:2px solid var(--court-line);border-radius:4px;pointer-events:none;}
.finder::after{content:"";position:absolute;left:14px;right:14px;top:50%;border-top:2px solid var(--court-line);pointer-events:none;}
.finder > *{position:relative;z-index:1;}
.finder h2{margin:0 0 4px;font-size:1.9rem;color:var(--court-ink);}
.finder .step{font-size:.95rem;opacity:.85;margin-bottom:18px;}
.finder .q{font-weight:600;font-size:1.2rem;margin:0 0 14px;}
.finder .opts{display:grid;gap:10px;}
.finder button.opt{appearance:none;text-align:left;font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:0;border-radius:8px;padding:14px 16px;cursor:pointer;}
.finder button.opt:hover{background:var(--ph-bg);}
.finder .progress{display:flex;gap:6px;margin-bottom:16px;}
.finder .progress span{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.28);}
.finder .progress span.on{background:var(--ball);}
.finder .result{background:var(--surface);color:var(--ink);border-radius:10px;padding:20px;}
.finder .result h3{margin:4px 0 6px;font-size:1.8rem;}
.finder .result .tag{display:inline-block;background:var(--ball);color:var(--ball-ink);font-weight:600;font-size:.9rem;padding:2px 10px;border-radius:999px;}
.finder .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btn{appearance:none;font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block;}
.btn-primary{background:var(--court);color:#fff;}
.btn-ghost{background:transparent;color:var(--link);box-shadow:inset 0 0 0 2px var(--line);}
.finder .back{background:none;border:0;color:var(--court-ink);font:inherit;opacity:.85;cursor:pointer;margin-top:14px;padding:4px 0;text-decoration:underline;}

/* Picks table */
section.block{padding:8px 0 40px;}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
table.picks{border-collapse:collapse;width:100%;min-width:720px;}
table.picks th,table.picks td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.picks thead th{font-size:.92rem;color:var(--muted);font-weight:600;background:var(--ph-bg);}
table.picks tbody tr:last-child td{border-bottom:0;}
table.picks td.name{font-weight:600;}
table.picks td.shape{width:64px;}
.shape-ico{width:34px;height:52px;color:var(--court);}
.note{font-size:.92rem;color:var(--muted);margin-top:10px;}

/* Guides */
.guide-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink);}
@media (max-width:800px){.guide-list{grid-template-columns:1fr;}}
.guide-list a{display:block;padding:18px 18px 22px 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);}
.guide-list a + a{padding-left:18px;}
@media (max-width:800px){.guide-list a + a{padding-left:0;}}
.guide-list strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;line-height:1.1;margin-bottom:6px;}
.guide-list span{color:var(--muted);font-size:.98rem;}
.guide-list .soon{opacity:.6;pointer-events:none;}

/* Article */
article.page{padding:36px 0 60px;}
.byline{color:var(--muted);font-size:.95rem;}
.answer{border-left:4px solid var(--ball);background:var(--surface);padding:16px 20px;border-radius:0 8px 8px 0;margin:20px 0 28px;}
.ph{background:var(--ph-bg);border:2px dashed var(--ph-line);border-radius:10px;color:var(--muted);padding:22px;margin:18px 0;font-size:.95rem;}
.ph.photo{aspect-ratio:16/8;display:flex;align-items:center;justify-content:center;text-align:center;}
.procon{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 10px;}
@media (max-width:640px){.procon{grid-template-columns:1fr;}}
.procon div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.procon h4{margin:0 0 6px;font-size:1rem;}
.procon ul{margin:0;padding-left:1.1em;}
.skip{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 14px;margin:10px 0;}
.buy{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;}
.ad{font-size:.85rem;color:var(--muted);}
.racket-head{display:flex;gap:16px;align-items:center;margin-top:2em;}
.racket-head svg{flex:none;}
.racket-head h3{margin:0;}
ol.mistakes li,ol.quick li{margin-bottom:.6em;}
.faq dt{font-weight:600;margin-top:1em;}
.faq dd{margin:4px 0 0;}
.author{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);margin-top:40px;padding-top:24px;}
.author .avatar{width:64px;height:64px;border-radius:50%;background:var(--ph-bg);border:2px dashed var(--ph-line);flex:none;}

/* Footer */
footer{border-top:1px solid var(--line);background:var(--surface);padding:28px 0 32px;font-size:.95rem;color:var(--muted);}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}
footer a{color:var(--muted);margin-right:16px;}

[hidden]{display:none !important;}
@media (prefers-reduced-motion:no-preference){
  .finder .stage{animation:in .22s ease-out;}
  @keyframes in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
}

/* Admin */
.admin h1{margin-bottom:.3em;}
.admin details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:14px 0;}
.admin details.sec > summary{cursor:pointer;padding:16px 20px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;}
.admin .sec-body{padding:0 20px 18px;max-width:820px;}
.admin details.sub{border-top:1px solid var(--line);padding:6px 0;}
.admin details.sub > summary{cursor:pointer;padding:10px 0;font-weight:600;}
.fld{margin:12px 0;}
.fld label{display:block;font-weight:600;font-size:.95rem;margin-bottom:4px;}
.fld input,.fld textarea,.fld select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;}
.fld textarea{resize:vertical;line-height:1.45;}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:3px solid var(--ball);outline-offset:1px;border-color:var(--court);}
fieldset.pairs{border:1px solid var(--line);border-radius:8px;padding:6px 16px 14px;margin:16px 0;}
fieldset.pairs legend{font-weight:600;padding:0 6px;}
.pair{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:6px;}
.btn-small{appearance:none;font:inherit;font-size:.92rem;font-weight:600;color:var(--link);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;}
.btn-small:hover{background:var(--ph-bg);}
.hint{color:var(--muted);font-size:.92rem;margin-top:10px;}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:12px 14px;margin:12px 0;}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--court);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08);}
.savebar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.savebar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
body:has(.savebar) footer{padding-bottom:110px;}
</style>
</head>

  var restore = draftOffer ? '<div class="notice">Es gibt einen nicht veröffentlichten Entwurf aus deiner letzten Sitzung. <button type="button" class="btn-small" data-act="restore">Entwurf wiederherstellen</button> <button type="button" class="btn-small" data-act="drop-draft">Verwerfen</button></div>' : '';
  return '<article class="page admin"><div class="wrap"><h1>Inhalte bearbeiten</h1>'+
    '<p class="prose">Änderungen siehst du sofort in der Vorschau. Für alle Besucher sichtbar werden sie erst mit „Veröffentlichen“. Text in **Sternchen** wird fett.</p>'+restore+
    ADMIN.map(function(sec, i){ return '<details class="sec"'+(i===0?' open':'')+'><summary>'+esc(sec.title)+'</summary><div class="sec-body" data-sec="'+i+'">'+sectionBody(sec)+'</div></details>'; }).join('')+
  '</div></article>';
}
function saveBar(){
  if (!canEdit || !dirty) return '';
  var onAdmin = currentRoute() === 'admin';
  return '<div class="savebar" role="region" aria-label="Ungespeicherte Änderungen"><div class="wrap"><span id="save-status">Ungespeicherte Änderungen</span><div class="savebar-actions">'+
    (onAdmin ? '<a class="btn btn-ghost" href="#start">Vorschau ansehen</a>' : '<a class="btn btn-ghost" href="#admin">Weiter bearbeiten</a>')+
    '<button type="button" class="btn btn-ghost" data-act="discard">Verwerfen</button>'+
    '<button type="button" class="btn btn-primary" data-act="publish"'+(readOnlyKnown?' disabled':'')+'>Veröffentlichen</button></div></div></div>';
}

/* ---------- document for publishing ---------- */
function buildDocument(data){
  var css = document.getElementById('site-style').textContent;
  var js = document.getElementById('app-script').textContent;
  var json = JSON.stringify(data, null, 1).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  var endTag = '<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>'+esc(data.site.metaTitle)+'</title>\n'+
    '<meta name="description" content="'+esc(data.site.metaDescription)+'">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">\n'+
    '<style id="site-style">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n'+
    '<script type="application/json" id="site-data">'+json+endTag+'\n'+
    '<script id="app-script">'+js+endTag+'\n</body>\n</html>\n';
}

function setStatus(t){ var el = document.getElementById('save-status'); if (el) el.textContent = t; }
function publishNow(){
  if (!artifactApi){ setStatus('Veröffentlichen ist in dieser Ansicht nicht möglich.'); return; }
  var html = buildDocument(state);
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {}
  setStatus('Wird veröffentlicht …');
  var btn = document.querySelector('[data-act="publish"]'); if (btn) btn.disabled = true;
  artifactApi.publish(html).then(function(){
    setStatus('Veröffentlicht. Die Seite lädt neu.');
  }).catch(function(err){
    var code = err && err.code;
    if (code === 'conflict') { setStatus('Inzwischen wurde eine neuere Version veröffentlicht. Die Seite lädt neu, dein Entwurf bleibt erhalten.'); return; }
    if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled' || code === 'not_declared') { readOnlyKnown = true; setStatus('Diese Ansicht ist schreibgeschützt. Öffne die Seite als Bearbeiter, um zu veröffentlichen.'); return; }
    if (btn) btn.disabled = false;
    if (code === 'too_large') setStatus('Die Seite ist zu groß zum Speichern. Kürze lange Texte.');
    else if (code === 'rate_limited') setStatus('Zu viele Veröffentlichungen in kurzer Zeit. Versuch es in einer Minute noch einmal.');
    else setStatus('Veröffentlichen ist fehlgeschlagen ('+(code||'unbekannt')+'). Versuch es noch einmal.');
  });
}

/* ---------- layout & routing ---------- */
var ROUTES = { 'start':viewStart, 'schlaeger-anfaenger':viewArticle, 'ueber-uns':viewAbout, 'werbehinweis':viewWerbe, 'impressum':viewImpressum, 'datenschutz':viewDatenschutz, 'admin':viewAdmin };
function currentRoute(){ var h = (location.hash||'').replace('#',''); return ROUTES[h] ? h : 'start'; }

function render(){
  var route = currentRoute(), s = state.site;
  var nav = [['start','Start'],['schlaeger-anfaenger','Schläger'],['ueber-uns','Über uns']];
  if (canEdit) nav.push(['admin','Admin']);
  document.getElementById('app').innerHTML =
    '<header class="site-header"><div class="wrap"><a class="brand" href="#start">'+LOGO+esc(s.name)+'</a><nav class="main" aria-label="Hauptnavigation">'+
      nav.map(function(n){ return '<a href="#'+n[0]+'"'+(n[0]===route?' aria-current="page"':'')+'>'+n[1]+'</a>'; }).join('')+
    '</nav></div></header><main>'+ROUTES[route]()+'</main>'+
    '<footer><div class="wrap"><div>'+fmt(s.footerText)+'</div><div><a href="#impressum">Impressum</a><a href="#datenschutz">Datenschutz</a><a href="#werbehinweis">Werbehinweis</a></div></div></footer>'+
    saveBar();
  document.title = route === 'schlaeger-anfaenger' ? state.article.metaTitle : (route === 'start' ? s.metaTitle : (document.querySelector('main h1') ? document.querySelector('main h1').textContent+' | '+s.name : s.metaTitle));
  if (route === 'start') renderFinder();
}
function route(){
  render();
  if (pendingScroll){ var el = document.getElementById(pendingScroll); pendingScroll = null; if (el){ el.scrollIntoView(); return; } }
  window.scrollTo(0,0);
}
function refreshBar(){
  var old = document.querySelector('.savebar');
  var html = saveBar();
  if (old) old.outerHTML = html || '';
  else if (html) document.getElementById('app').insertAdjacentHTML('beforeend', html);
}
function markDirty(){ var was = dirty; dirty = JSON.stringify(state) !== ORIGINAL; if (was !== dirty) refreshBar(); }

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('opt')){ answers.push(b.getAttribute('data-v')); renderFinder(); var f = document.querySelector('#finder-stage button'); if (f) f.focus({preventScroll:true}); return; }
  var act = b.getAttribute('data-act'); if (!act) return;
  if (act === 'back'){ answers.pop(); renderFinder(); }
  else if (act === 'reset'){ answers = []; renderFinder(); }
  else if (act === 'more'){ pendingScroll = 'r-'+b.getAttribute('data-k'); if (location.hash === '#schlaeger-anfaenger') route(); else location.hash = 'schlaeger-anfaenger'; }
  else if (act === 'publish'){ publishNow(); }
  else if (act === 'discard'){ state = JSON.parse(ORIGINAL); dirty = false; try { sessionStorage.removeItem(DRAFT_KEY); } catch (er) {} route(); }
  else if (act === 'restore'){ try { state = JSON.parse(draftOffer); } catch (er) {} draftOffer = null; markDirty(); route(); }
  else if (act === 'drop-draft'){ draftOffer = null; try { sessionStorage.removeItem(DRAFT_KEY); } catch (er) {} route(); }
  else if (act === 'pair-add' || act === 'pair-del'){
    var path = b.getAttribute('data-path'), list = getPath(state, path);
    if (act === 'pair-add'){ var it = {}; it[b.getAttribute('data-k1')] = ''; it[b.getAttribute('data-k2')] = ''; list.push(it); }
    else list.splice(parseInt(b.getAttribute('data-i'),10), 1);
    var fs = b.closest('fieldset'); fs.outerHTML = pairsHtml(path, fs.querySelector('legend').textContent, fs.getAttribute('data-spec'));
    markDirty();
  }
});
document.addEventListener('input', function(e){
  var el = e.target, path = el.getAttribute && el.getAttribute('data-path'); if (!path) return;
  var type = el.getAttribute('data-type');
  var val = type === LINES ? el.value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean) : el.value;
  setPath(state, path, val);
  if (/^rackets\.\d+\.name$/.test(path)){ var sum = el.closest('details.sub'); if (sum) sum.querySelector('summary').textContent = el.value; }
  markDirty();
});
document.addEventListener('change', function(e){ if (e.target.tagName === 'SELECT') e.target.dispatchEvent(new Event('input', {bubbles:true})); });
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', function(e){ if (dirty){ try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (er) {} } });

route();

/* ---------- capabilities (light up later) ---------- */
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('user').then(function(user){
    if (!user) return;
    return user.canEdit().then(function(ok){ if (ok){ canEdit = true; render(); } });
  }).catch(function(){});
  window.claude.use('artifact').then(function(a){ artifactApi = a; }).catch(function(){});
}
})();
</script>
</body>
</html>
